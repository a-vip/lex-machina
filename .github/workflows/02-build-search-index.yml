name: "02 - Build & Verify Search Index (SQLite FTS5 + BM25 + Provenance)"

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - "01 - Ingest & Build Legal Git Corpus"
    types:
      - completed

permissions:
  contents: read

jobs:
  verify-and-refresh-search-index:
    name: Verify SQLite FTS5, BM25, Provenance & Bitemporal Schedules
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout corpus orphan branch on Cloud Runner
        uses: actions/checkout@v4
        with:
          ref: corpus
          fetch-depth: 1

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate SQLite FTS5, BM25, Provenance, Concordance & Applicability
        run: |
          python - << 'EOF'
          import json
          import sqlite3
          from pathlib import Path

          search_json = json.loads(Path("search-index.json").read_text(encoding="utf-8"))
          bm25_json = json.loads(Path("bm25-index.json").read_text(encoding="utf-8"))
          graph_json = json.loads(Path("graph.json").read_text(encoding="utf-8"))
          prov_json = json.loads(Path("provenance.json").read_text(encoding="utf-8"))
          conc_json = json.loads(Path("concordance.json").read_text(encoding="utf-8"))
          app_json = json.loads(Path("applicability.json").read_text(encoding="utf-8"))

          print(f"Verified search-index.json: {search_json['total_provisions']} indexed provisions across {len(search_json['commits'])} institutional commits.")
          print(f"Verified bm25-index.json: {bm25_json['doc_count']} docs, {len(bm25_json['postings'])} normalized UK/US terms.")
          print(f"Verified graph.json: {graph_json['node_count']} instruments, {graph_json['edge_count']} cross-reference edges.")
          print(f"Verified provenance.json: {prov_json['total_stages']} stages with cryptographic SHA-256 digests.")
          print(f"Verified concordance.json: {sum(len(v) for v in conc_json['concordances'].values())} cross-stage renumbering norms.")
          print(f"Verified applicability.json: {len(app_json['rules'])} bitemporal enforceability rules.")

          conn = sqlite3.connect("search-index.sqlite")
          cur = conn.cursor()
          rows = cur.execute(
              "SELECT instrument_path, provision, heading FROM provisions_fts WHERE provisions_fts MATCH 'biometric OR vulnerability OR autonomous' LIMIT 10;"
          ).fetchall()
          print(f"FTS5 smoke query returned {len(rows)} top hits:")
          for r in rows:
              print("  ->", r)
          conn.close()
          EOF
