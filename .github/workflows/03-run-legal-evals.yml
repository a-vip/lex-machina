name: "03 - Run LexMachina-Eval (150-Case Legal Verification Benchmark)"

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - "01 - Ingest & Build Legal Git Corpus"
    types:
      - completed

permissions:
  contents: write

jobs:
  run-eval:
    name: Execute 120-Case Preregistered Legal Benchmark & Publish Scorecard
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout main branch (eval harness & MCP server)
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install cloud-only MCP server dependencies
        run: |
          pip install httpx mcp

      - name: Execute 120-case LexMachina-Eval against live refs/heads/corpus
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python evals/run_eval.py \
            --bench evals/lexmachina_bench.jsonl \
            --output-json /tmp/eval-scorecard.json \
            --output-md /tmp/EVAL_REPORT.md \
            --min-pass-rate 0.90
          cat /tmp/EVAL_REPORT.md >> "$GITHUB_STEP_SUMMARY"

      - name: Persist eval-scorecard.json & EVAL_REPORT.md onto refs/heads/corpus
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "Lex Machina Eval Bot"
          git config user.email "evals@lex-machina.org"
          git fetch --depth=1 origin refs/heads/corpus:refs/remotes/origin/corpus
          git worktree add -B corpus /tmp/corpus-eval refs/remotes/origin/corpus
          cp /tmp/eval-scorecard.json /tmp/corpus-eval/eval-scorecard.json
          cp /tmp/EVAL_REPORT.md /tmp/corpus-eval/EVAL_REPORT.md
          pushd /tmp/corpus-eval
          git add eval-scorecard.json EVAL_REPORT.md
          if ! git diff --cached --quiet; then
            git commit -m "[lexmachina-eval] Publish verified empirical benchmark scorecard"
            git push origin HEAD:refs/heads/corpus
          fi
          popd
